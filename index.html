<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Olivier Refalo OpenSource Timeline</title>
  <style>
    @font-face {
      font-family: "Lato";
      font-style: normal;
      font-weight: 400;
      src: url(https://fonts.gstatic.com/s/lato/v24/S6uyw4BMUTPHjx4wWw.ttf) format("truetype");
    }

    @font-face {
      font-family: "Raleway";
      font-style: normal;
      font-weight: 400;
      src: url(https://fonts.gstatic.com/s/raleway/v28/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVvaorCIPrQ.ttf) format("truetype");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      color: #2c2c2c;
      min-width: 600px;
      height: 100%;
      background: white;
      font: 400 1em "Lato";
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      background-image: linear-gradient(currentColor, currentColor);
      background-position: 0% 100%;
      background-repeat: no-repeat;
      background-size: 0% 4px;
      transition: background-size cubic-bezier(0, 0.5, 0, 1) 0.3s;
    }

    a:hover,
    a:focus {
      text-decoration: none;
      background-size: 100% 4px;
    }

    .name {
      text-align: center;
      font: 400 400% Tahoma;
      color: #969696;
      -webkit-text-stroke: 0.25px;
    }

    .name .home {
      font: 100 30% Tahoma;
    }

    #timeline {
      padding-top: 5%;
    }

    .timeline {
      height: 100%;
      position: relative;
    }

    .timeline canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
    }

    .timeline figcaption {
      font: 900 25px "Lato";
      text-transform: uppercase;
      -webkit-text-stroke: 0.25px;
    }

    .timeline figcaption img.icon {
      width: 28px;
      height: 28px;
      vertical-align: middle;
      margin: 0 10px 4px 0;
    }

    .timeline h2 {
      font: 400 400% "Raleway";
      padding-bottom: 100px;
      color: #b2cde9;
      font-size: 50px;
    }

    .timeline h6 {
      color: #0090f5;
      font: 400 80% Tahoma;
    }

    .timeline p,
    .timeline ol {
      font: 400 95% "Raleway";
      padding: 3px 0 20px 0;
      color: #575757;
      text-align: justify;
      width: 70%;
    }

    .timeline ol {
      list-style: disc;
      margin-top: -20px;
      padding-left: 40px;
    }

    .timeline figure {
      float: right;
      width: 100%;
    }

    .timeline article {
      position: relative;
      float: left;
      width: 26%;
      overflow: hidden;
      margin-bottom: 100px;
    }

    .timeline article:nth-of-type(2) {
      margin-left: 14%;
    }

    .timeline article:nth-of-type(3) {
      margin-left: 4%;
    }

    .timeline article:first-of-type {
      text-align: right;
    }

    .timeline article:first-of-type p,
    .timeline article:first-of-type figure {
      float: right;
    }

    .timeline article:nth-of-type(2) h2 {
      color: #c6e0aa;
    }

    .timeline article:nth-of-type(2) h6 {
      color: #40aa00;
    }

    .timeline article:nth-of-type(3) h2 {
      color: #f7e08a;
    }

    .timeline article:nth-of-type(3) h6 {
      color: #d9a400;
    }

    .timeline article a {
      color: #575757;
    }

    .timeline article a:hover {
      color: #a6a6a6;
    }
  </style>
  <base target="_blank" />
  <script src="prefixfree.min.js"></script>
</head>
